<nav aria-label="Principal" style="display: flex; flex-wrap: wrap; gap: 8px 28px; font-size: 14px; letter-spacing: 0.04em">

<a href="Conta.dc.html" aria-label="Conta" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></a>
<a href="Carrinho.dc.html" aria-label="Carrinho, 2 artigos" style="height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 8px; text-decoration: none; color: #C9A96E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 8h14l-1 13H6L5 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg><span style="font-size: 13px">2</span></a>

<main style="max-width: 1280px; margin: 0 auto; padding: 56px clamp(16px, 4vw, 48px) 0">
<h1 style="margin: 0 0 40px; font-family: 'Bodoni Moda', serif; font-weight: 400; font-size: 52px">O seu carrinho</h1>
<div style="display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start">
<section aria-label="Artigos" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; border-top: 1px solid #2E2A25">
<sc-for list="{{items}}" as="i" hint-placeholder-count="2">
<div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 28px 0; border-bottom: 1px solid #2E2A25; align-items: center">
<div style="flex: 0 0 120px; height: 150px; background: #1C1A17; display: flex; flex-direction: column; align-items: center; justify-content: center">
<div style="width: 18px; height: 12px; background: #3A352E"></div>
<div style="width: 58px; height: 76px; border: 1px solid #4A443B; border-radius: 6px; background: {{i.tint}}"></div>
</div>
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Bodoni Moda', serif; font-size: 26px">{{i.name}}</span>
<span style="font-size: 14px; color: #A39A8C">{{i.size}}</span>
<span style="font-size: 13px; color: {{i.stockColor}}">{{i.stock}}</span>
</div>
<div style="display: flex; align-items: center; border: 1px solid #4A443B">
<button type="button" aria-label="Diminuir quantidade" style="width: 44px; height: 44px; background: none; border: 0; color: #EFE9DF; font-size: 18px; cursor: pointer">−</button>
<span style="width: 36px; text-align: center">1</span>
<button type="button" aria-label="Aumentar quantidade" style="width: 44px; height: 44px; background: none; border: 0; color: #EFE9DF; font-size: 18px; cursor: pointer">+</button>
</div>
<span style="flex: 0 0 110px; text-align: right; font-size: 18px; font-weight: 600">{{i.price}}</span>
<button type="button" aria-label="Remover artigo" style="width: 44px; height: 44px; background: none; border: 0; color: #A39A8C; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-for>
<a href="Catalogo.dc.html" style="padding-top: 24px; font-size: 14px">← Continuar a comprar</a>
</section>

<aside aria-label="Resumo" style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 18px; padding: 32px; background: #1C1A17">
<h2 style="margin: 0; font-family: 'Bodoni Moda', serif; font-weight: 400; font-size: 28px">Resumo</h2>
<div style="display: flex; justify-content: space-between; font-size: 15px"><span style="color: #A39A8C">Subtotal</span><span>153,00 €</span></div>
<div style="display: flex; justify-content: space-between; font-size: 15px"><span style="color: #A39A8C">Portes</span><span>[PORTES]</span></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="cupao" style="font-size: 13px; color: #A39A8C">Código promocional</label>
<div style="display: flex; gap: 8px">
<input id="cupao" type="text" style="flex: 1 1 auto; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 12px; background: #12110F; border: 1px solid #2E2A25; color: #EFE9DF; font-family: inherit">
<button type="button" style="height: 44px; padding: 0 16px; background: none; border: 1px solid #4A443B; color: #EFE9DF; font-family: inherit; cursor: pointer">Aplicar</button>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; padding-top: 18px; border-top: 1px solid #2E2A25"><span style="font-size: 16px; font-weight: 600">Total</span><span style="font-size: 26px; font-weight: 600">153,00 €</span></div>
<span style="font-size: 12px; color: #A39A8C">IVA incluído. A fatura é emitida automaticamente após a confirmação.</span>
<a href="Checkout.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; background: #C9A96E; color: #12110F; font-size: 15px; font-weight: 600; text-decoration: none">Finalizar compra</a>
</aside>
</div>
</main>
</div>
</x-dc>
